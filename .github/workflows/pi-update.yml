name: Update Pi Digits

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install mpmath

      - name: Generate next pi chunk
        run: |
          python scripts/add_pi_chunk.py

      - name: Commit and push new chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/chunks

          git commit -m "Added new pi digit chunk" || echo "No changes"

          git pull --rebase

          git push